name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      native_ref:
        description: Native source revision to pair with this web revision
        type: string
        default: main
      scope:
        description: Run only changed-component coverage when other results remain valid
        type: choice
        default: all
        options: [all, interop, browser, build]
      browser_shard:
        description: Focus a changed shard after retaining unchanged passing coverage
        type: choice
        default: all
        options: [all, '1', '2', '3', '4']

jobs:
  native-interop:
    if: ${{ inputs.scope != 'browser' && inputs.scope != 'build' }}
    name: Web and native interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      IRIS_CHAT_RS_CORE_DIR: ${{ github.workspace }}/iris-chat-rs/core
      IRIS_DIRECT_FILES_TARGET_DIR: ${{ github.workspace }}/iris-chat-rs/core/target
      IRIS_PRIVATE_CONTROL_FIXTURE_INPUT: ${{ github.workspace }}/iris-chat/test-results/private-controls/native-private-controls.json
      IRIS_PRIVATE_STATE_FIXTURE_INPUT: ${{ github.workspace }}/iris-chat/test-results/private-controls/native-private-state.json
    defaults:
      run:
        working-directory: iris-chat
    steps:
      - uses: actions/checkout@v4
        with:
          path: iris-chat

      - name: Checkout native app
        uses: actions/checkout@v4
        with:
          repository: irislib/iris-chat-rs
          ref: ${{ inputs.native_ref || 'main' }}
          path: iris-chat-rs
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: iris-chat/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: iris-chat/pnpm-lock.yaml

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Record tested revisions
        run: |
          git log -1 --format='web %H'
          git -C "$IRIS_CHAT_RS_CORE_DIR" log -1 --format='native %H'

      - name: Cache locked native compiler inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iris-chat-rs/core/target
          key: native-interop-${{ runner.os }}-${{ hashFiles('iris-chat-rs/core/Cargo.lock', 'iris-chat/test-fixtures/direct-files-rust/Cargo.lock') }}
          restore-keys: |
            native-interop-${{ runner.os }}-

      - name: Install web dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build locked native core
        run: cargo build --locked --manifest-path "$IRIS_CHAT_RS_CORE_DIR/Cargo.toml" --bin iris

      - name: Generate controls through the native app
        run: |
          mkdir -p "$(dirname "$IRIS_PRIVATE_CONTROL_FIXTURE_INPUT")"
          IRIS_PRIVATE_CONTROL_FIXTURE_OUTPUT="$IRIS_PRIVATE_CONTROL_FIXTURE_INPUT" \
            cargo test --locked --manifest-path "$IRIS_CHAT_RS_CORE_DIR/Cargo.toml" \
            --lib native_private_control_interop_fixture -- --nocapture
          test -s "$IRIS_PRIVATE_CONTROL_FIXTURE_INPUT"
          IRIS_PRIVATE_STATE_FIXTURE_OUTPUT="$IRIS_PRIVATE_STATE_FIXTURE_INPUT" \
            cargo test --locked --manifest-path "$IRIS_CHAT_RS_CORE_DIR/Cargo.toml" \
            --lib private_contacts_negentropy_repairs_dropped_snapshots_and_exports_interop -- --nocapture
          test -s "$IRIS_PRIVATE_STATE_FIXTURE_INPUT"
          git -C "$IRIS_CHAT_RS_CORE_DIR" rev-parse HEAD > test-results/private-controls/source-commit.txt
          cd test-results/private-controls
          sha256sum native-private-controls.json native-private-state.json > SHA256SUMS

      - name: Build locked native direct-file fixture
        id: direct_fixture
        run: cargo build --quiet --locked --manifest-path test-fixtures/direct-files-rust/Cargo.toml --target-dir "$IRIS_DIRECT_FILES_TARGET_DIR"
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'

      - name: Verify web and native messaging and device sync
        run: pnpm test:interop --output=test-results/native-messaging --trace=retain-on-failure --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-messaging.json

      - name: Verify web and native direct files
        if: ${{ !cancelled() && steps.direct_fixture.outcome == 'success' }}
        run: pnpm test:direct-file-interop --output=test-results/direct-files --trace=retain-on-failure --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/direct-files.json

      - name: Upload interop test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interop-test-results
          path: |
            iris-chat/test-results/
            iris-chat/work/direct-file-interop/
          retention-days: 14

  e2e:
    if: ${{ inputs.scope != 'interop' && inputs.scope != 'build' }}
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.browser_shard != '' && inputs.browser_shard != 'all' && format('[{0}]', inputs.browser_shard) || '[1,2,3,4]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: matrix.shard == 1
        run: pnpm run check

      - name: Unit tests
        if: matrix.shard == 1
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/4 --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: |
            test-results/
            work/calls/
            work/calls-routed/
            work/web-screen-sharing/
            work/web-mentions*.png
          retention-days: 30

  production-build:
    if: ${{ inputs.scope == 'build' }}
    name: Retained production web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Record exact source and every output
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          files = []
          for path in sorted((root / 'dist').rglob('*')):
              if path.is_file():
                  files.append({'path': path.relative_to(root / 'dist').as_posix(),
                                'size': path.stat().st_size,
                                'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          assert files and (root / 'dist/index.html').is_file()
          record = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'version': json.loads((root / 'package.json').read_text())['version'],
                    'lockSHA256': hashlib.sha256((root / 'pnpm-lock.yaml').read_bytes()).hexdigest(),
                    'node': subprocess.check_output(['node', '--version'], text=True).strip(),
                    'pnpm': subprocess.check_output(['pnpm', '--version'], text=True).strip(),
                    'files': files}
          (root / 'production-build.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-web-build
          include-hidden-files: true
          path: |
            dist/
            production-build.json
          if-no-files-found: error
          retention-days: 30
