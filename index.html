<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      if (
        window.location.protocol.startsWith("http") &&
        ["chat.iris.to", "iris-chat.irisapp.workers.dev"].includes(window.location.hostname)
      ) {
        document.write('<base href="/">')
      }
    </script>

    <meta charset="UTF-8" />
    <script>
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('iris-chat-theme')
        } catch {}
        const preference = stored === 'light' || stored === 'dark' ? stored : 'system'
        const systemLight = window.matchMedia('(prefers-color-scheme: light)').matches
        const resolved = preference === 'system' ? (systemLight ? 'light' : 'dark') : preference
        document.documentElement.dataset.themePreference = preference
        document.documentElement.dataset.theme = resolved
      })()
    </script>
    <link rel="icon" type="image/png" href="./img/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" href="./img/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>iris chat</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
