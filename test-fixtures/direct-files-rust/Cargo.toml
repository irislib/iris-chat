[package]
name = "iris-chat-direct-files-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22.1"
nvpn-fips-core = { version = "=0.4.123", features = ["webrtc-transport", "host-ble-transport"] }
nvpn-fips-tcp = "=0.2.6"
nvpn-fips-tcp-endpoint = "=0.2.57"
nvpn-fips-file-transfer = "=0.1.7"
flume = "0.11"
nostr = { version = "0.44.7", default-features = false, features = ["std", "nip44"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs"] }
